{% extends 'accounts/base.html' %}
{% block title %}Login · App Management{% endblock %}
{% block content %}
<div class="login-form">
    <h1>Login</h1>
    {% if form.errors %}<p role="alert">Invalid username or password.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
