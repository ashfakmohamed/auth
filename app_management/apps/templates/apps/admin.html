{% extends 'accounts/base.html' %}
{% block title %}Admin dashboard · App Management{% endblock %}
{% block content %}
<div class="admin-panel">
    <h1>Administrator dashboard</h1>
    <form id="add-app-form">
        <label>App name <input type="text" name="name" required></label>
        <label>App link <input type="url" name="link" required></label>
        <label>Category <input type="text" name="category" required></label>
        <label>Sub-category <input type="text" name="sub_category"></label>
        <label>Points <input type="number" name="points" min="0" required></label>
        <button type="submit">Add app</button>
    </form>
    <p id="form-status" role="status"></p>
</div>
{% endblock %}
